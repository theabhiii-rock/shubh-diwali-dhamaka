<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="Shubh Diwali Dhamaka Royal Diya Emblem">
  <defs>
    <!-- Rich Brass & Antique Gold Gradient -->
    <linearGradient id="brassGrad" x1="20" y1="65" x2="100" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="25%" stop-color="#FFD700"/>
      <stop offset="60%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8B5A00"/>
    </linearGradient>

    <!-- Deep Crimson & Saffron Flame Gradient -->
    <linearGradient id="flameGrad" x1="60" y1="12" x2="60" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="20%" stop-color="#FFF59D"/>
      <stop offset="45%" stop-color="#FFB300"/>
      <stop offset="75%" stop-color="#FF6F00"/>
      <stop offset="100%" stop-color="#D32F2F"/>
    </linearGradient>

    <!-- Warm Radiance Aura -->
    <radialGradient id="diyaAura" cx="60" cy="42" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#FF6F00" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#D32F2F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>

    <!-- Rangoli Petal Pattern Gradient -->
    <linearGradient id="petalGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF6F00" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Ambient Flame Radiance Glow -->
  <circle cx="60" cy="45" r="42" fill="url(#diyaAura)"/>

  <!-- Rangoli Decorative Star Rays -->
  <g opacity="0.75" stroke="#FFD700" stroke-width="1.4" stroke-linecap="round">
    <line x1="60" y1="6" x2="60" y2="18"/>
    <line x1="60" y1="72" x2="60" y2="82"/>
    <line x1="22" y1="45" x2="34" y2="45"/>
    <line x1="86" y1="45" x2="98" y2="45"/>
    <line x1="33" y1="18" x2="41" y2="26"/>
    <line x1="79" y1="64" x2="87" y2="72"/>
    <line x1="87" y1="18" x2="79" y2="26"/>
    <line x1="41" y1="64" x2="33" y2="72"/>
  </g>

  <!-- Traditional Terracotta / Brass Diya Base -->
  <path d="M22 68C22 92 38 104 60 104C82 104 98 92 98 68C98 64 22 64 22 68Z" 
        fill="url(#brassGrad)" 
        stroke="#FFF59D" 
        stroke-width="1.8"/>

  <!-- Diya Rim with Beaded Golden Texture -->
  <ellipse cx="60" cy="68" rx="38" ry="8.5" fill="#D4AF37" stroke="#FFF59D" stroke-width="1.2"/>
  <ellipse cx="60" cy="68" rx="32" ry="5.5" fill="#8B5A00"/>

  <!-- Ornate Diya Engraving Accent -->
  <path d="M36 80C42 90 52 96 60 96C68 96 78 90 84 80" stroke="#FFF59D" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Multi-layered Flickering Flame -->
  <path d="M60 15C65 28 75 38 71 52C67 61 53 61 49 52C45 38 55 28 60 15Z" 
        fill="url(#flameGrad)">
    <animate attributeName="d" 
      values="M60 15C65 28 75 38 71 52C67 61 53 61 49 52C45 38 55 28 60 15Z;
              M60 11C68 26 72 36 68 53C64 62 54 62 50 53C46 36 52 26 60 11Z;
              M60 15C65 28 75 38 71 52C67 61 53 61 49 52C45 38 55 28 60 15Z" 
      dur="1.8s" 
      repeatCount="indefinite"/>
  </path>

  <!-- Luminous Flame Core -->
  <ellipse cx="60" cy="49" rx="5.5" ry="8.5" fill="#FFFFFF" opacity="0.95"/>
  <ellipse cx="60" cy="49" rx="3" ry="5" fill="#FFFDE7"/>
</svg>
