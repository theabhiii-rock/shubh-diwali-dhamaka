<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="pr_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8c64e" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f8c64e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pr_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a0d17"/>
      <stop offset="50%" stop-color="#1f0307"/>
      <stop offset="100%" stop-color="#0a0103"/>
    </linearGradient>
    <linearGradient id="pr_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="50%" stop-color="#f8c64e"/>
      <stop offset="100%" stop-color="#996c10"/>
    </linearGradient>
    <linearGradient id="pr_paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#f5e1ad"/>
    </linearGradient>
    <filter id="pr_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#pr_glow)"/>
  <!-- Top Paper Input Tray -->
  <path d="M18 10 H46 V24 H18 Z" fill="url(#pr_paper)" stroke="url(#pr_gold)" stroke-width="1.5" rx="2"/>
  <line x1="22" y1="14" x2="42" y2="14" stroke="#d4af37" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="22" y1="18" x2="38" y2="18" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Printer Body -->
  <rect x="8" y="22" width="48" height="26" rx="6" fill="url(#pr_body)" stroke="url(#pr_gold)" stroke-width="2" filter="url(#pr_shadow)"/>
  <!-- Front Slot -->
  <rect x="14" y="34" width="36" height="6" rx="2" fill="#000" stroke="url(#pr_gold)" stroke-width="1"/>
  <!-- Output Printed Golden Pass -->
  <path d="M16 36 H48 V56 H16 Z" fill="url(#pr_gold)" stroke="#fff" stroke-width="0.75" rx="1.5" filter="url(#pr_shadow)"/>
  <text x="32" y="48" fill="#4a0d17" font-size="6" font-weight="900" text-anchor="middle" font-family="Cinzel, serif">PASS</text>
  <!-- LED indicators -->
  <circle cx="48" cy="27" r="1.5" fill="#4ade80"/>
  <circle cx="43" cy="27" r="1.5" fill="#f8c64e"/>
</svg>