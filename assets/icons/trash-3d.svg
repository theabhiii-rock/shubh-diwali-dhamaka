<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="tr_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tr_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#1c0404"/>
    </linearGradient>
    <linearGradient id="tr_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="tr_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#tr_glow)"/>
  <!-- Bin Canister -->
  <path d="M20 22 L23 52 A 4 4 0 0 0 27 56 H 37 A 4 4 0 0 0 41 52 L 44 22 Z" fill="url(#tr_body)" stroke="url(#tr_gold)" stroke-width="2" filter="url(#tr_shadow)"/>
  <!-- Canister ribs -->
  <line x1="28" y1="28" x2="29" y2="48" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="32" y1="28" x2="32" y2="48" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="36" y1="28" x2="35" y2="48" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Bin Lid -->
  <rect x="16" y="16" width="32" height="6" rx="3" fill="url(#tr_gold)" stroke="#fff" stroke-width="0.75" filter="url(#tr_shadow)"/>
  <path d="M28 16 V12 A 2 2 0 0 1 30 10 H 34 A 2 2 0 0 1 36 12 V 16" fill="none" stroke="url(#tr_gold)" stroke-width="2"/>
</svg>