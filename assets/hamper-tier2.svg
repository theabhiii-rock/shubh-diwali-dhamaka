<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" aria-label="Grand Celebration Hamper Tier 2">
  <defs>
    <linearGradient id="crateWood2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A1887F"/>
      <stop offset="50%" stop-color="#6D4C41"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="boxOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9800"/>
      <stop offset="100%" stop-color="#E65100"/>
    </linearGradient>
    <linearGradient id="boxPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8E24AA"/>
      <stop offset="100%" stop-color="#4A148C"/>
    </linearGradient>
    <linearGradient id="anarCone2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="50%" stop-color="#FB8C00"/>
      <stop offset="100%" stop-color="#D84315"/>
    </linearGradient>
    <radialGradient id="sparkGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#FFB300" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF8F00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="160" cy="175" rx="130" ry="20" fill="url(#sparkGlow2)" opacity="0.6"/>

  <!-- Celebration Base Tray -->
  <rect x="35" y="148" width="250" height="38" rx="4" fill="url(#crateWood2)" stroke="#BCAAA4" stroke-width="1.5"/>
  <line x1="35" y1="166" x2="285" y2="166" stroke="#4E342E" stroke-width="1.5"/>
  <text x="160" y="162" fill="#FFE082" font-family="'Cinzel', serif" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">GRAND CELEBRATION BOX • 60 SHOT</text>

  <!-- Main 120-Shot Aerial Cake Box (Center) -->
  <rect x="110" y="65" width="100" height="84" rx="3" fill="url(#boxOrange)" stroke="#FFE082" stroke-width="1.5"/>
  <rect x="115" y="70" width="90" height="74" fill="none" stroke="#FFE082" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="160" y="90" fill="#FFF" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">60 SHOT</text>
  <text x="160" y="103" fill="#FFE082" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">MULTI COLOR SKY CAKE</text>
  <circle cx="160" cy="122" r="14" fill="#FFD54F"/>
  <text x="160" y="126" fill="#BF360C" font-family="sans-serif" font-size="9" font-weight="bold" text-anchor="middle">★</text>

  <!-- Left Box (2000-Wala Garland) -->
  <rect x="52" y="85" width="62" height="64" rx="2" fill="url(#boxPurple)" stroke="#FFE082" stroke-width="1.2"/>
  <text x="83" y="106" fill="#FFF" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">2000 LADI</text>
  <text x="83" y="118" fill="#E1BEE7" font-family="sans-serif" font-size="6.5" text-anchor="middle">DELUXE</text>

  <!-- Right Box (Flower Pots) -->
  <rect x="206" y="85" width="62" height="64" rx="2" fill="#2E7D32" stroke="#FFE082" stroke-width="1.2"/>
  <text x="237" y="106" fill="#FFF" font-family="sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">COLOR ANAR</text>
  <text x="237" y="118" fill="#C8E6C9" font-family="sans-serif" font-size="6.5" text-anchor="middle">10 PACKS</text>

  <!-- Cones & Chakkars in Front -->
  <polygon points="125,152 138,122 151,152" fill="url(#anarCone2)" stroke="#FFD54F" stroke-width="1"/>
  <polygon points="169,152 182,122 195,152" fill="url(#anarCone2)" stroke="#FFD54F" stroke-width="1"/>
  <circle cx="102" cy="150" r="12" fill="#D84315" stroke="#FFE082" stroke-width="1"/>
  <circle cx="218" cy="150" r="12" fill="#D84315" stroke="#FFE082" stroke-width="1"/>

  <!-- Clay Diya Center Front -->
  <g transform="translate(144, 162)">
    <path d="M 0 14 Q 16 22 32 14 Q 16 6 0 14 Z" fill="#D84315" stroke="#BF360C" stroke-width="1"/>
    <path d="M 16 7 Q 20 0 16 -6 Q 12 0 16 7 Z" fill="#FFF59D"/>
    <path d="M 16 7 Q 18 2 16 -2 Q 14 2 16 7 Z" fill="#FF6F00"/>
  </g>
</svg>