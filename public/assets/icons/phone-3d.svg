<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="ph_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8c64e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f8c64e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ph_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a0d16"/>
      <stop offset="50%" stop-color="#140205"/>
      <stop offset="100%" stop-color="#050001"/>
    </linearGradient>
    <linearGradient id="ph_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2b2"/>
      <stop offset="50%" stop-color="#f8c64e"/>
      <stop offset="100%" stop-color="#80560b"/>
    </linearGradient>
    <linearGradient id="ph_screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#4c0519"/>
    </linearGradient>
    <filter id="ph_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#ph_glow)"/>
  <!-- Phone Body -->
  <rect x="18" y="8" width="28" height="48" rx="7" fill="url(#ph_body)" stroke="url(#ph_gold)" stroke-width="1.8" filter="url(#ph_shadow)"/>
  <!-- Screen -->
  <rect x="21" y="14" width="22" height="36" rx="4" fill="url(#ph_screen)"/>
  <!-- Speaker notch -->
  <rect x="28" y="11" width="8" height="1.5" rx="0.75" fill="#f8c64e"/>
  <!-- Screen Diwali Diya Graphic -->
  <path d="M 26 34 Q 32 38 38 34 Q 32 37 26 34 Z" fill="#ffd700"/>
  <ellipse cx="32" cy="28" rx="2.5" ry="4.5" fill="#ff4d00"/>
  <ellipse cx="32" cy="28.5" rx="1.2" ry="2.5" fill="#ffff80"/>
  <!-- Home indicator line -->
  <rect x="28" y="52" width="8" height="1.5" rx="0.75" fill="#f8c64e"/>
</svg>