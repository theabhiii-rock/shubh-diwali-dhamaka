<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="cl_glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8c64e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f8c64e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cl_board" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a1827"/>
      <stop offset="50%" stop-color="#2a060d"/>
      <stop offset="100%" stop-color="#120104"/>
    </linearGradient>
    <linearGradient id="cl_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0aa"/>
      <stop offset="50%" stop-color="#f8c64e"/>
      <stop offset="100%" stop-color="#996c10"/>
    </linearGradient>
    <linearGradient id="cl_sheet" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="100%" stop-color="#faecc5"/>
    </linearGradient>
    <filter id="cl_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.8"/>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#cl_glow)"/>
  <!-- Board Backing -->
  <rect x="12" y="10" width="40" height="48" rx="6" fill="url(#cl_board)" stroke="url(#cl_gold)" stroke-width="1.8" filter="url(#cl_shadow)"/>
  <!-- Paper Sheet -->
  <rect x="16" y="16" width="32" height="38" rx="3" fill="url(#cl_sheet)" stroke="#d4af37" stroke-width="0.8"/>
  <!-- Lines of text -->
  <line x1="22" y1="26" x2="42" y2="26" stroke="#8c6d23" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="32" x2="38" y2="32" stroke="#8c6d23" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="38" x2="42" y2="38" stroke="#8c6d23" stroke-width="2" stroke-linecap="round"/>
  <line x1="22" y1="44" x2="32" y2="44" stroke="#8c6d23" stroke-width="2" stroke-linecap="round"/>
  <!-- Wax Diya Seal on Paper -->
  <circle cx="38" cy="45" r="5" fill="#dc2626" stroke="url(#cl_gold)" stroke-width="1"/>
  <circle cx="38" cy="45" r="2.5" fill="#f8c64e"/>
  <!-- Metallic Golden Clamp -->
  <rect x="22" y="6" width="20" height="8" rx="3" fill="url(#cl_gold)" stroke="#fff" stroke-width="0.75" filter="url(#cl_shadow)"/>
  <circle cx="32" cy="10" r="2" fill="#2a060d"/>
</svg>