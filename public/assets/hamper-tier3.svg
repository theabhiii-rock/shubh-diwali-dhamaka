<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" fill="none" aria-label="Shubh Diwali Special Hamper Tier 3">
  <defs>
    <linearGradient id="crateWood3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8D6E63"/>
      <stop offset="100%" stop-color="#4E342E"/>
    </linearGradient>
    <linearGradient id="boxTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#004D40"/>
    </linearGradient>
    <linearGradient id="boxMaroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2185B"/>
      <stop offset="100%" stop-color="#880E4F"/>
    </linearGradient>
    <radialGradient id="sparkGlow3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF9C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFB300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <ellipse cx="160" cy="175" rx="120" ry="18" fill="url(#sparkGlow3)" opacity="0.5"/>

  <!-- Base Tray -->
  <rect x="45" y="150" width="230" height="34" rx="4" fill="url(#crateWood3)" stroke="#D7CCC8" stroke-width="1"/>
  <text x="160" y="163" fill="#FFE082" font-family="'Cinzel', serif" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">SHUBH DIWALI SPECIAL • 25 SHOT</text>

  <!-- 25-Shot Sky Cake Box -->
  <rect x="115" y="75" width="90" height="76" rx="3" fill="url(#boxTeal)" stroke="#FFE082" stroke-width="1.2"/>
  <text x="160" y="98" fill="#FFF" font-family="sans-serif" font-size="9.5" font-weight="900" text-anchor="middle">25 SHOT</text>
  <text x="160" y="110" fill="#80CBC4" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">AERIAL DISPLAY</text>

  <!-- Left Box 500-Ladi -->
  <rect x="62" y="92" width="55" height="58" rx="2" fill="url(#boxMaroon)" stroke="#FFE082" stroke-width="1"/>
  <text x="89" y="112" fill="#FFF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">500 LADI</text>

  <!-- Right Box Sparklers -->
  <rect x="203" y="92" width="55" height="58" rx="2" fill="#F57C00" stroke="#FFE082" stroke-width="1"/>
  <text x="230" y="112" fill="#FFF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">SPARKLERS</text>

  <!-- Anar in Center Front -->
  <polygon points="145,152 160,126 175,152" fill="#FFA000" stroke="#FFE082" stroke-width="1"/>
  <circle cx="125" cy="152" r="10" fill="#E65100" stroke="#FFE082" stroke-width="1"/>
  <circle cx="195" cy="152" r="10" fill="#E65100" stroke="#FFE082" stroke-width="1"/>

  <!-- Diya -->
  <g transform="translate(144, 162)">
    <path d="M 0 12 Q 16 18 32 12 Q 16 6 0 12 Z" fill="#D84315"/>
    <path d="M 16 6 Q 20 0 16 -5 Q 12 0 16 6 Z" fill="#FFF59D"/>
  </g>
</svg>